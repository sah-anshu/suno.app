# SPDX-License-Identifier: GPL-3.0-only
# On a version tag (v0.1.0, ...): builds signed APKs of Suno, Suno Companion and Suno TV, one per CPU type, and
# attaches them to a draft GitHub release for a person to check and publish. Signing uses the repository secrets
# SUNO_KEYSTORE_BASE64, SUNO_KEYSTORE_PASSWORD, SUNO_KEY_ALIAS and SUNO_KEY_PASSWORD (docs/RELEASE.md).
# Without them the APKs are signed with a throwaway debug key and the release says so.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370" "cmake;4.1.2"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.SUNO_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SUNO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SUNO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SUNO_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/suno-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/suno-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: Checks
        run: ./gradlew ktlintCheck detekt test testPatientDebugUnitTest

      - name: Signed APKs per CPU type
        run: ./gradlew :app:assembleLocalRelease -PsunoLocalRelease=true -PsunoSplitApks=true

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ "$SIGNING" = "debug" ]; then
            printf '\n**Test build:** signed with a throwaway debug key. Do not use for updates.\n' >> notes.md
          fi
          printf '\nSource: %s/%s/tree/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: app/build/outputs/apk/*/release/*-release.apk

      - name: Remove signing files
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/suno-release.jks"
